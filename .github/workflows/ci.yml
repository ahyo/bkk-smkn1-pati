name: Uji aplikasi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bkk
          POSTGRES_PASSWORD: bkk
          POSTGRES_DB: bkk_smkn1pati
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://bkk:bkk@localhost:5432/bkk_smkn1pati
      SECRET_KEY: kunci-uji-otomatis-yang-panjang-sekali-1234567890
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Muat data contoh
        run: python -m app.seed --reset

      - name: Uji asap seluruh rute
        run: python scripts/smoke_test.py

      - name: Pastikan aset demo tersinkron dengan aplikasi
        run: |
          python scripts/build_demo_assets.py
          if ! git diff --quiet -- docs/assets; then
            echo "::error::Aset demo tertinggal dari aplikasi."
            echo "Jalankan 'python scripts/build_demo_assets.py' lalu commit hasilnya."
            git diff --stat -- docs/assets
            exit 1
          fi
          echo "Aset demo sudah sesuai."

      - name: Pastikan tidak ada emoji pada antarmuka
        run: |
          if grep -rlP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{26FF}]' app/templates docs/assets/demo-app.js; then
            echo "::error::Antarmuka memakai emoji. Gunakan sistem ikon SVG (app/icons.py)."
            exit 1
          fi
          echo "Antarmuka bebas emoji."
