{% extends "layout/base.html" %}
{% block title %}Ganti Kata Sandi{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto">
  <div class="card-head"><h1 style="font-size:1.25rem;margin:0">Ganti Kata Sandi</h1></div>
  <div class="card-body">
    <form method="post" action="/akun/kata-sandi">
      <div class="field">
        <label for="current_password">Kata sandi saat ini <span class="req">*</span></label>
        <input id="current_password" type="password" name="current_password" required>
      </div>
      <div class="field">
        <label for="new_password">Kata sandi baru <span class="req">*</span></label>
        <input id="new_password" type="password" name="new_password" required>
        <div class="help">Minimal 8 karakter, memuat huruf dan angka.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Ulangi kata sandi baru <span class="req">*</span></label>
        <input id="confirm_password" type="password" name="confirm_password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Simpan Perubahan</button>
    </form>
  </div>
</div>
{% endblock %}
