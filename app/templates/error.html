{% extends "layout/base.html" %}
{% block title %}Kesalahan {{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:620px;margin:3rem auto">
  <div class="card-body center">
    <div class="error-mark">{{ icon({403:'lock',404:'search',422:'file'}.get(code,'warning'), '3xl') }}</div>
    <h1 style="font-size:2.6rem;margin:.3rem 0">{{ code }}</h1>
    <p class="muted">{{ detail }}</p>
    <div class="btn-group mt-2" style="justify-content:center">
      <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
      <a href="/lowongan" class="btn btn-outline">Lihat Lowongan</a>
    </div>
  </div>
</div>
{% endblock %}
