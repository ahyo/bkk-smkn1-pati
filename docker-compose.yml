services:
  db:
    image: postgres:16-alpine
    container_name: bkk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bkk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bkk}
      POSTGRES_DB: ${POSTGRES_DB:-bkk_smkn1pati}
    volumes:
      - bkk_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bkk} -d ${POSTGRES_DB:-bkk_smkn1pati}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: bkk-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY wajib diisi pada berkas .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bkk}:${POSTGRES_PASSWORD:-bkk}@db:5432/${POSTGRES_DB:-bkk_smkn1pati}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bkksmkn1pati.sch.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#12345}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    volumes:
      - bkk_uploads:/srv/bkk/app/static/uploads
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  bkk_pgdata:
  bkk_uploads:
